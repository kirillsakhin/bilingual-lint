  cues: ['преимуществ\w+', 'приоритет\w*', 'преобладающ\w+', 'превалир\w+']
  equal: ['равн\w+\s+юридическ\w+\s+сил\w+', 'одинаков\w+\s+юридическ\w+\s+сил\w+', 'равн\w+\s+сил\w+']
