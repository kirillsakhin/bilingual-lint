# Russian wordlists. List entries are regular-expression fragments,
# matched case-insensitively. Text and entries are compared with "ё" folded to "е"
# only for number words; other patterns list both spellings where needed.
currencies:
  USD: ['долл(?:ар\w*|\.)(?:\s*США)?']
  EUR: ['евро']
  GBP: ['фунт\w*(?:\s+стерлингов)?']
  RUB: ['(?:российск\w+\s+)?руб(?:л\w+|\.)?']
  CHF: ['швейцарск\w+\s+франк\w*']
  CNY: ['юан\w+']
percent: ['процент\w*']
duration_units:
  day: ['дневн\w+', 'дн(?:я|ей|ю|ями|ях)', 'день', 'сут\w+']
  week: ['недел\w+']
  month: ['месяц\w*']
  year: ['год(?:а|у|ом|ы|ов)?', 'лет']
  hour: ['час(?:а|ов|у)?']
day_types:
  business: ['рабоч\w+']
  banking: ['банковск\w+']
  calendar: ['календарн\w+']
# A clock time in hours and minutes after a preposition or a dash; the
# preposition keeps a length of time ("длится 3 ч. 15 м.") out.
clock_time: '(?:в|с|до|к|по|от|после|около|[-–—])\s+(?P<hour>\d{1,2})\s?(?:час|ч)\.?\s?(?P<minute>\d{2})\s?(?:мин|м)\.?'
months:
  января: 1
  январь: 1
  февраля: 2
  февраль: 2
  марта: 3
  март: 3
  апреля: 4
  апрель: 4
  мая: 5
  май: 5
  июня: 6
  июнь: 6
  июля: 7
  июль: 7
  августа: 8
  август: 8
  сентября: 9
  сентябрь: 9
  октября: 10
  октябрь: 10
  ноября: 11
  ноябрь: 11
  декабря: 12
  декабрь: 12
ref_keywords: ['подпункт\w*', 'пункт\w*', 'п\.\s?п\.', 'пп\.', 'п\.', 'стать\w+', 'статей', 'ст\.', 'раздел\w*']
